<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISUCON スコアと順位</title>
<style>
  :root {
    --bg: #fafaf7;
    --fg: #1a1a1a;
    --muted: #555;
    --card: #ffffff;
    --border: #e2e2dd;
    --accent: #c8322b;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    line-height: 1.7;
    font-size: 15px;
  }
  main { max-width: 720px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  header { border-bottom: 3px solid var(--accent); padding-bottom: 1rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.8rem; margin: 0 0 .35rem; }
  .subtitle { color: var(--muted); margin: 0; font-size: .95rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { list-style: none; padding: 0; }
  li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin: .8rem 0; }
  li b { font-size: 1.1rem; }
  li p { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
<header>
  <h1>ISUCON スコアと順位</h1>
  <p class="subtitle">過去の ISUCON の全チームスコアから、スコアがいくつなら何位だったかを調べる練習用の早見ページ</p>
</header>
<ul>
  <li><a href="isucon13/"><b>ISUCON13</b></a><p>2023-11-25 開催。出典は公式の「ISUCON13 受賞チームおよび全チームスコア」</p></li>
</ul>
</main>
</body>
</html>
